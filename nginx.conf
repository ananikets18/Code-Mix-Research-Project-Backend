worker_processes auto;
worker_rlimit_nofile 65535;


events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}


http {
    # Basic Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    types_hash_max_size 2048;
    server_tokens off;
    
    # MIME Types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;
    
    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    
    # Upstream API servers
    upstream api_backend {
        least_conn;
        server api:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    # Logging Format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    
    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";
    
    # ========================================
    # HTTP to HTTPS Redirect
    # ========================================
    server {
        listen 80;
        server_name 139.59.34.173.nip.io www.139.59.34.173.nip.io;
        return 301 https://$server_name$request_uri;
    }

    # ========================================
    # HTTPS Server (SSL)
    # ========================================
    server {
        listen 443 ssl http2;
        server_name 139.59.34.173.nip.io www.139.59.34.173.nip.io;

        # SSL Certificates (Managed by Certbot)
        ssl_certificate /etc/letsencrypt/live/139.59.34.173.nip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/139.59.34.173.nip.io/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        
        # ========================================
        # Security Headers
        # ========================================
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        
        # ========================================
        # Request Limits
        # ========================================
        client_max_body_size 10M;
        client_body_buffer_size 128k;
        client_header_buffer_size 1k;
        large_client_header_buffers 4 16k;
        
        # ========================================
        # Timeouts (Increased for ML Model Inference)
        # ========================================
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;      # 5 minutes - for model processing
        proxy_read_timeout 300s;       # 5 minutes - for model response
        send_timeout 300s;
        
        # ========================================
        # API Proxy Configuration
        # ========================================
        location / {
            # Rate limiting
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;
            
            # Connection limiting (max 10 connections per IP)
            limit_conn addr 10;
            
            # Proxy settings
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            
            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            # Keepalive
            proxy_set_header Connection "";
        }
        
        # ========================================
        # Health Check Endpoint (No Rate Limiting)
        # ========================================
        location /health {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            access_log off;
        }
        
        # ========================================
        # Main /analyze Endpoint (NLP Analysis)
        # ========================================
        location /analyze {
            # Only allow POST requests
            limit_except POST {
                deny all;
            }
            
            # Rate limiting for analyze endpoint
            limit_req zone=api_limit burst=5 nodelay;
            
            # Proxy settings
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Increased timeouts for ML model inference (4 models)
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;     # 10 minutes for model processing
            proxy_read_timeout 600s;      # 10 minutes for model response
            
            # Buffering for large responses from models
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
            
            # Keepalive
            proxy_set_header Connection "";
        }
        
        # ========================================
        # Deny Access to Hidden Files
        # ========================================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
